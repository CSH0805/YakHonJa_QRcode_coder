<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>처방전 등록 - YakSok QR</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="page">

  <section id="key-gate">
    <h1>의료진 로그인</h1>
    <p class="subtitle">발급받은 API 키를 입력해주세요. 이 브라우저 탭에서만 유지됩니다.</p>
    <form id="key-form" class="card">
      <label for="api-key-input">API 키</label>
      <input type="password" id="api-key-input" autocomplete="off" required>
      <div id="key-error" class="field-error hidden"></div>
      <button type="submit">확인</button>
    </form>
  </section>

  <section id="admin-app" class="hidden">
    <h1>처방전 등록</h1>
    <p class="subtitle">한 처방전에 포함된 약을 모두 등록하면 QR 코드 하나가 생성됩니다. 환자는 YakSok 앱으로 이 QR을 스캔해 복약 일정에 등록할 수 있습니다.</p>
    <button type="button" id="change-key-btn" class="secondary-btn">API 키 변경</button>

    <form id="prescription-form" class="card">
      <label>복용 시간 (처방전 전체 공통)</label>
      <div class="checkbox-group">
        <label><input type="checkbox" name="times" value="morning"> 아침</label>
        <label><input type="checkbox" name="times" value="afternoon"> 점심</label>
        <label><input type="checkbox" name="times" value="evening"> 저녁</label>
        <label><input type="checkbox" name="times" value="bedtime"> 취침 전</label>
      </div>

      <div class="date-row">
        <div>
          <label for="start_date">시작일</label>
          <input type="date" id="start_date" name="start_date" required>
        </div>
        <div>
          <label for="end_date">종료일</label>
          <input type="date" id="end_date" name="end_date" required>
        </div>
      </div>

      <label>약 목록</label>
      <div id="medicine-list"></div>
      <button type="button" id="add-medicine-btn" class="secondary-btn">+ 약 추가</button>

      <div id="form-error" class="field-error hidden"></div>
      <button type="submit" id="submit-btn">QR 생성하기</button>
    </form>

    <div id="result-card" class="card result hidden">
      <h2>QR이 생성되었습니다</h2>
      <img id="result-qr-image" alt="생성된 QR 코드">
      <div id="result-qr-url" class="qr-url"></div>
      <a id="result-download" class="download" download="prescription-qr.png">PNG로 다운로드</a>
    </div>
  </section>

</div>

<template id="medicine-row-template">
  <div class="medicine-row card">
    <div class="medicine-row-header">
      <strong class="medicine-row-title"></strong>
      <button type="button" class="remove-medicine-btn">삭제</button>
    </div>
    <label>약 이름</label>
    <input type="text" class="medicine-name" maxlength="200" required>
    <label>1회 복용량</label>
    <input type="text" class="medicine-dose" maxlength="50" placeholder="예: 1정" required>
    <label>주의사항 (선택)</label>
    <textarea class="medicine-caution" maxlength="2000"></textarea>
  </div>
</template>

<script src="/js/admin.js"></script>
</body>
</html>
